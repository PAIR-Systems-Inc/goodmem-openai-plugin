name: SDK reference freshness

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "plugins/goodmem/skills/goodmem-sdk/**"
      - "scripts/sdk-refs/**"
      - ".github/workflows/sdk-refs-freshness.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require all four stamps and compare supported versions against registries
        run: python3 scripts/sdk-refs/freshness.py
